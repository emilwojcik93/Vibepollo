name: probe-touch-ux
on:
  push:
    branches: [probe/touch-ux]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
      - name: build
        shell: msys2 {0}
        run: |
          g++ --version | head -n1
          for o in O0 O1 O2 O3; do
            g++ -std=gnu++23 -$o -DNDEBUG -Wall -Werror -D_WIN32_WINNT=0x0A00 -static -o helper-$o.exe tools/touch_ux_helper.cpp -lole32 -loleaut32 -luuid -luser32
          done
          ls -la helper-*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: helper-exes
          path: helper-*.exe
